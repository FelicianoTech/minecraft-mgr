name: main-wf

on: push

jobs:
  test-on-ubuntu:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: "Update the OS before we start. Sometimes avoids OS-level bugs."
        run: sudo apt-get update && sudo apt-get dist-upgrade
      - name: "Install Ubuntu Desktop since the launcher needs it."
        run: sudo apt-get install -y ubuntu-desktop
      - run: |
          sudo ./minecraft-mgr.sh install
          echo "The new executable is located at:"
          which minecraft-launcher
